name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # ---------- 测试（每次 push/PR 都跑）----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r platform/requirements.txt

      - name: Run tests
        run: cd platform && python -m pytest tests/ -q

      # 前端是手写单文件(index.html)，提交前先校验内嵌 JS，防止改坏页面
      - name: Frontend JS syntax check
        run: |
          python - <<'PY'
          import re
          h = open('platform/pi_meta/web/index.html', encoding='utf-8').read()
          js = '\n'.join(re.findall(r'<script>(.*?)</script>', h, re.S))
          open('/tmp/check.js', 'w', encoding='utf-8').write(js)
          PY
          node --check /tmp/check.js

      # 启动/部署 shell 脚本静态检查
      - name: Shellcheck scripts
        run: |
          for f in platform/run.sh platform/start_redkb.sh platform/start_pimeta.sh platform/guard_redkb.sh; do
            shellcheck -S warning "$f"
          done

  # ---------- 构建并发布镜像到 GHCR（打 tag 时触发）----------
  build-push:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 多架构：amd64 + arm64（非容器出网受限的构建机也不会被卡）
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 内层缓存：加速重复构建
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- Kali 沙箱镜像（自包含，随 tag 一起发） ----------
      - name: Extract kali metadata
        id: meta-kali
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/redbee-kali
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push kali
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.kali
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-kali.outputs.tags }}
          labels: ${{ steps.meta-kali.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
