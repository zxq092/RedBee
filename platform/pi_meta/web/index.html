<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="docTitle">渗透智能体 · 控制台</title>
<style>
  :root {
    /* 基础 */
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2a3441;
    --text:#e6edf3; --muted:#8b949e; --accent:#4f8cff; --accent2:#5ad1a4;
    --red:#ff5c5c; --yellow:#ffc247; --purple:#b083f0; --green:#7ee787;
    /* 语义化（暗色值；白天模式在 [data-theme=light] 覆盖）。
       ⚠️ 必须写具体色值——自引用 var 是 CSS 循环，计算为 invalid，
       会导致漏洞板背景/标题色/选中态等全部静默失效（曾踩坑） */
    --hover:#1c2330; --code-bg:#0d1117; --code-border:#30363d;
    --card-bg:#161b22; --board-bg:#0d1117; --chip-bg:#2a3441;
    --blue:#79c0ff; --blue-soft:#a5d8ff;
    --danger-bg:#3d1f24; --danger-border:#6e3237; --danger-text:#ff7b72;
    --muted2:#7d8590; --pill-bg:#21262d; --toast-bg:#30363d; --map-dot:#8b949e;
    --sel:#1f2a3a; --selbar:#263043; --sb-thumb:#3a4553;
  }
  /* ---- 白天模式 ---- */
  [data-theme="light"] {
    --bg:#f6f8fa; --panel:#ffffff; --panel2:#f0f3f6; --border:#d0d7de;
    --text:#24292f; --muted:var(--muted2); --accent:#0969da; --accent2:#1a7f37;
    --red:#cf222e; --yellow:#9a6700; --purple:#8250df; --green:#1a7f37;
    --hover:#eaeef2; --code-bg:#ffffff; --code-border:#d0d7de;
    --card-bg:#ffffff; --board-bg:#e9eef5; --chip-bg:#d1d9e0;
    --blue:#0969da; --blue-soft:#0550ae;
    --danger-bg:#ffebe9; --danger-border:#ffaba8; --danger-text:#cf222e;
    --muted2:#59636e; --pill-bg:#eaeef2; --toast-bg:#6e7781; --map-dot:#8c959f;
    --sel:#ddf4ff; --selbar:#ddf4ff; --sb-thumb:#afb8c1;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--text); height:100vh; overflow:hidden; }
  #app { display:flex; height:100vh; }

  /* ---- 左侧会话栏 ---- */
  aside { width:264px; min-width:220px; background:var(--panel); border-right:1px solid var(--border);
          display:flex; flex-direction:column; }
  .brand { padding:14px 16px; font-size:16px; font-weight:800; color:var(--accent);
           border-bottom:1px solid var(--border); letter-spacing:.5px; }
  .brand small { display:block; font-size:11px; color:var(--muted); font-weight:500; margin-top:2px; }
  #newbtn { margin:10px 12px 6px; }
  #sessSearch { margin:0 12px 8px; width:calc(100% - 24px); font-size:12px; }
  #sessToolbar { display:flex; align-items:center; justify-content:space-between; gap:8px;
                 padding:4px 12px 6px; }
  #sessToolbar .selall { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:5px; cursor:pointer; }
  #sessToolbar .selall input { cursor:pointer; }
  #sessToolbar .bulkd { font-size:12px; padding:4px 9px; }
  #sessToolbar .bulkd:disabled { opacity:.4; cursor:not-allowed; }
  #sessToolbar .bulkd.armed { background:var(--danger-bg); border-color:var(--danger-border); color:var(--danger-text); }
  .sess .ck { width:15px; height:15px; flex-shrink:0; cursor:pointer; accent-color:var(--accent);
              opacity:0; transition:opacity .1s; }
  .sess:hover .ck, .sess .ck:checked { opacity:1; }
  .sess.selected { background:var(--sel); }
  #sessionList { flex:1; overflow-y:auto; padding:2px 8px; }
  .sess { padding:8px 8px 8px 10px; border-radius:8px; cursor:pointer; color:var(--muted); font-size:13px;
          display:flex; flex-direction:row; align-items:center; gap:6px; position:relative; }
  .sess:hover { background:var(--panel2); }
  .sess.active { background:var(--selbar); color:var(--text); }
  .sess .si { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .sess .t { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px; }
  .sess .m { font-size:11px; color:var(--muted); }
  .run-dot { width:7px; height:7px; border-radius:50%; background:var(--green); flex-shrink:0;
             animation:pulse 1.4s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .sess .acts { display:none; gap:4px; flex-shrink:0; }
  .sess:hover .acts { display:flex; }
  .ibtn { background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:6px;
          width:22px; height:22px; font-size:12px; cursor:pointer; line-height:1; }
  .ibtn:hover { border-color:var(--accent); color:var(--text); }
  .ibtn.del:hover { background:var(--danger-bg); color:var(--danger-text); border-color:var(--danger-border); }
  .ibtn.armed { width:auto; padding:0 6px; background:var(--danger-bg); color:var(--danger-text); border-color:var(--danger-border); font-size:11px; }
  .rename-input { width:100%; font-size:12.5px; background:var(--bg); border:1px solid var(--accent);
                  border-radius:5px; color:var(--text); padding:2px 5px; outline:none; }
  aside footer { padding:10px 14px; border-top:1px solid var(--border); font-size:11px; color:var(--muted); }

  /* ---- 主区 ---- */
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #topbar { padding:10px 16px; border-bottom:1px solid var(--border); display:flex;
            align-items:center; gap:10px; flex-wrap:wrap; background:var(--panel); }
  #topbar label { font-size:12px; color:var(--muted); }
  input,select { background:var(--bg); color:var(--text); border:1px solid var(--border);
                 border-radius:7px; padding:7px 10px; font-size:13px; outline:none; }
  input:focus,select:focus { border-color:var(--accent); }
  #targetInput { flex:1; min-width:180px; }
  .tbtn { background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:7px;
          padding:6px 11px; font-size:12.5px; cursor:pointer; }
  .tbtn:hover { border-color:var(--accent); color:var(--text); }
  .tbtn.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .send.stopping { background:#a63232; border-color:#c0392b; }
  .send.stopping:hover { background:#c0392b; }
  .boardline { align-self:flex-start; background:none; border:none; color:var(--muted2); font-size:11px;
               padding:2px 8px; line-height:1.5; }
  #authbar { margin-left:auto; display:flex; gap:6px; align-items:center; }
  #userBadge { font-size:12px; color:var(--muted); white-space:nowrap; }

  /* ---- 对话区 ---- */
  #content { flex:1; display:flex; flex-direction:column; min-height:0; position:relative; }
  #chatView { flex:1; display:flex; flex-direction:column; min-height:0; }
  #msgs { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
  /* 全局任务总览视图 */
  #taskView { flex:1; display:flex; flex-direction:column; min-height:0; }
  .tv-head { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--panel);
             border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .tv-title { font-weight:700; font-size:14px; }
  .tv-count { margin-left:auto; font-size:12px; }
  .tv-wrap { flex:1; overflow:auto; min-height:0; }
  .tv-table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .tv-table th { position:sticky; top:0; background:var(--panel2); text-align:left; padding:8px 10px;
                 border-bottom:1px solid var(--border); color:var(--muted); font-size:11.5px; white-space:nowrap; z-index:1; }
  .tv-table td { padding:7px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
  .tv-table tbody tr:hover td { background:var(--hover); }
  .tv-tid { font-family:ui-monospace,monospace; font-size:11px; color:var(--muted); }
  .tv-tt { display:block; max-width:360px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px; }
  .tv-acts { display:flex; gap:6px; white-space:nowrap; }
  /* 从任务总览跳转定位：目标记录行闪烁高亮 */
  @keyframes recflash { 0%{background:var(--sel);} 100%{background:transparent;} }
  .flash-rec { animation:recflash 2s ease-out; border-radius:6px; }
  .msg { max-width:920px; padding:11px 14px; border-radius:12px; line-height:1.6; font-size:13.5px;
         white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; background:var(--accent); color:#fff; }
  .msg.assistant { align-self:flex-start; background:var(--panel2); border:1px solid var(--border); }
  .msg.sys { align-self:center; background:var(--code-border); color:var(--muted); font-size:12px; }
  .msg.error { align-self:flex-start; background:var(--danger-bg); border:1px solid var(--danger-border); color:var(--danger-text); }
  .meta-line { font-size:11px; color:var(--muted); margin-bottom:4px; }
  .status-pill { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; }
  .st-running{background:#2b4a2b;color:var(--green);} .st-done{background:#2b3a5f;color:var(--blue);}
  .st-error{background:var(--danger-bg);color:var(--danger-text);} .st-cancel{background:#3d3520;color:var(--yellow);}
  .st-found{background:var(--pill-bg);color:var(--muted);} .st-confirmed{background:#2b4a2b;color:var(--green);}
  .st-false_positive{background:var(--danger-bg);color:var(--danger-text);}

  /* ---- 执行过程卡片（按模块分组）---- */
  .livecard { align-self:flex-start; width:100%; max-width:920px; background:var(--card-bg); border:1px solid var(--border);
              border-radius:12px; overflow:hidden; }
  .lc-head { display:flex; align-items:center; gap:10px; padding:9px 12px; background:var(--panel2);
             border-bottom:1px solid var(--border); font-size:12.5px; }
  .lc-dot { width:9px; height:9px; border-radius:50%; background:var(--green); animation:pulse 1.4s infinite; flex-shrink:0; }
  .lc-dot.done { background:var(--blue); animation:none; }
  .lc-dot.dead { background:var(--red); animation:none; }
  .lc-title { font-weight:700; }
  .lc-status { font-size:11px; font-weight:700; padding:1px 8px; border-radius:9px; }
  .lc-status.st-running { color:var(--green); }
  .lc-status.st-done { color:var(--blue); }
  .lc-status.st-error { color:var(--danger-text); }
  .lc-status.st-cancel { color:var(--yellow); }
  .lc-meta { color:var(--muted); font-size:11.5px; }
  .lc-follow { margin-left:auto; }
  .lc-follow.off { opacity:.5; }
  .lc-agent { font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:9px; flex-shrink:0;
    background:rgba(56,139,253,.15); color:var(--blue); border:1px solid rgba(56,139,253,.4); }
  .lc-stepper { display:flex; align-items:center; gap:3px; flex:1; min-width:0; overflow:hidden; }
  .ph { font-size:10px; padding:1px 6px; border-radius:8px; white-space:nowrap; flex-shrink:0;
    background:var(--hover); color:var(--muted); border:1px solid var(--code-border); }
  .ph.cur { background:rgba(63,185,80,.18); color:var(--green); border-color:rgba(63,185,80,.5); font-weight:700; }
  .ph.done { background:var(--chip-bg); color:var(--blue); border-color:var(--code-border); }
  .ph-sep { color:var(--border); font-size:9px; flex-shrink:0; }
  .mod-agent { font-size:9.5px; padding:0 5px; border-radius:6px; flex-shrink:0;
    background:rgba(56,139,253,.12); color:var(--blue); border:1px solid rgba(56,139,253,.3); }
  .lc-modules { max-height:340px; overflow-y:auto; }
  .rep-dl { margin-left:auto; }
  .lc-mod { border-top:1px solid var(--code-border); }
  .lc-mod:first-child { border-top:none; }
  .lc-mod-head { display:flex; align-items:center; gap:8px; padding:7px 12px; cursor:pointer; font-size:12.5px; }
  .lc-mod-head:hover { background:var(--hover); }
  .mod-dot { width:7px; height:7px; border-radius:50%; background:var(--green); animation:pulse 1.4s infinite; flex-shrink:0; }
  .mod-dot.done { background:var(--blue); animation:none; }
  .mod-dot.dead { background:var(--red); animation:none; }
  .mod-name { font-weight:700; color:var(--blue-soft); font-family:ui-monospace,monospace; }
  .mod-state { color:var(--muted); font-size:11.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mod-calls { color:var(--muted); font-size:11px; flex-shrink:0; }
  .chev { color:var(--muted); font-size:11px; flex-shrink:0; transition:transform .15s; }
  .lc-mod.collapsed .chev { transform:rotate(-90deg); }
  .lc-mod.collapsed .lc-mod-body { display:none; }
  .lc-mod-body { padding:2px 12px 8px 28px; }
  .lc-entry { display:flex; gap:8px; align-items:baseline; padding:2.5px 0; cursor:pointer;
              font-family:ui-monospace,monospace; font-size:11.5px; border-radius:5px; }
  .lc-entry:hover { background:var(--hover); }
  .e-time { color:var(--muted2); flex-shrink:0; }
  .e-tool { color:var(--blue); font-weight:700; flex-shrink:0; min-width:86px; }
  .e-brief { color:#c9d1d9; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .e-full { background:var(--code-bg); border:1px solid var(--code-border); border-radius:7px; padding:8px 10px; margin:3px 0 7px;
            font-size:11px; line-height:1.5; white-space:pre-wrap; word-break:break-word;
            max-height:220px; overflow:auto; color:#a5d6ff; }
  .lc-empty { color:var(--muted); font-size:12px; padding:8px 12px; }

  /* ---- 漏洞板区（融进执行卡，实时）---- */
  .lc-board { border-top:1px solid var(--border); background:var(--board-bg); }
  .lb-head { display:flex; align-items:center; gap:8px; padding:7px 12px; border-bottom:1px solid var(--code-border); font-size:12px; }
  .lb-title { font-weight:700; color:var(--blue-soft); }
  .lb-count { font-size:11px; color:var(--muted); }
  .lb-rep { margin-left:auto; }
  .lb-rep:disabled { opacity:.5; cursor:wait; }
  .lb-list { max-height:230px; overflow-y:auto; padding:3px 0; }
  .lb-empty { color:var(--muted); font-size:12px; padding:6px 12px; }
  .lb-row { display:flex; gap:8px; align-items:center; padding:5px 12px; cursor:pointer; font-size:12.5px; }
  .lb-row:hover { background:var(--hover); }
  .lb-row .f-title { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb-loc { color:var(--muted); font-size:11px; font-family:ui-monospace,monospace; max-width:32%;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex-shrink:0; }
  .lb-fp { opacity:.5; }
  .lb-fp .f-title { text-decoration:line-through; }
  /* ---- 漏洞严重度分布条（纯 CSS 像素条 + 图例）---- */
  /* 漏洞摘要块（板顶，滚动时 sticky 置顶；总览行 + 每类漏洞一行代表标题）*/
  .lb-digest { position:sticky; top:0; z-index:2; padding:8px 12px; border-bottom:1px solid var(--code-border);
               background:var(--code-bg); font-size:12px; }
  .lb-digest .dg-head { font-weight:700; color:var(--blue-soft); font-size:11px; margin-bottom:4px; letter-spacing:.5px; }
  .lb-digest .dg-total { color:var(--text); margin-bottom:4px; line-height:1.4; }
  .lb-digest .dg-line { display:flex; gap:6px; align-items:baseline; padding:1.5px 0; line-height:1.45; }
  .lb-digest .dg-dot { width:8px; height:8px; border-radius:2px; flex-shrink:0; transform:translateY(1px); }
  .lb-digest .dg-cls { font-weight:700; white-space:nowrap; }
  .lb-digest .dg-titles { color:var(--muted); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb-digest .dg-more { color:var(--muted); font-size:11px; padding-top:2px; }
  .lb-sevbar { display:flex; flex-direction:column; gap:4px; padding:8px 12px; border-bottom:1px solid var(--code-border); }
  .lb-sevbar .bar { display:flex; height:7px; border-radius:4px; overflow:hidden; background:var(--chip-bg); }
  .lb-sevbar .bar i { height:100%; display:block; }
  .lb-sevbar .bar i.s-critical{background:#ff5c5c;} .lb-sevbar .bar i.s-high{background:#f0883e;}
  .lb-sevbar .bar i.s-medium{background:var(--yellow);} .lb-sevbar .bar i.s-low{background:#79c0ff;}
  .lb-sevbar .bar i.s-info{background:var(--map-dot);}
  /* 板行手动状态按钮（误报/确认/恢复/撤销） */
  .f-acts { display:flex; gap:4px; flex-shrink:0; }
  .f-act { border:1px solid var(--border); background:transparent; color:var(--muted); border-radius:5px;
           font-size:10.5px; padding:1px 6px; cursor:pointer; line-height:1.5; }
  .f-act:hover { color:var(--text); border-color:var(--accent); }
  .f-act:disabled { opacity:.5; cursor:default; }
  /* 任务记录行的 findings 展开板 */
  .record-detail { padding:6px 10px 10px; border-top:1px dashed var(--border); margin-top:4px; }
  .record-detail .lb-list { max-height:280px; }
  /* 报告预览 modal */
  .md-overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:90;
                display:flex; align-items:center; justify-content:center; }
  .md-modal { width:min(980px,92vw); max-height:88vh; display:flex; flex-direction:column;
              background:var(--panel); border:1px solid var(--border); border-radius:12px;
              box-shadow:0 10px 44px rgba(0,0,0,.5); }
  .md-head { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--border); }
  .md-title { font-weight:700; font-size:14px; }
  .md-body { overflow:auto; padding:16px 24px; font-size:13.5px; line-height:1.7; }
  .md-body pre { background:var(--code-bg); border:1px solid var(--code-border); padding:10px 12px;
                 border-radius:8px; overflow-x:auto; font-size:12px; line-height:1.55; margin:8px 0; }
  .md-body code { font-family:ui-monospace,monospace; background:var(--chip-bg); padding:1px 4px;
                  border-radius:4px; font-size:12px; }
  .md-body pre code { background:none; padding:0; }
  .md-body h1,.md-body h2,.md-body h3 { margin:16px 0 8px; line-height:1.35; }
  .md-body h1 { font-size:19px; border-bottom:1px solid var(--border); padding-bottom:6px; }
  .md-body h2 { font-size:16px; } .md-body h3 { font-size:14px; }
  .md-body p { margin:7px 0; }
  .md-body table { border-collapse:collapse; margin:10px 0; width:100%; font-size:12.5px; }
  .md-body th,.md-body td { border:1px solid var(--border); padding:5px 9px; text-align:left; }
  .md-body th { background:var(--panel2); }
  .md-body ul,.md-body ol { padding-left:22px; margin:7px 0; }
  .md-body blockquote { border-left:3px solid var(--border); padding-left:10px; color:var(--muted); margin:8px 0; }
  .md-body a { color:var(--accent); }
  .lb-sevbar .legend { display:flex; gap:10px; flex-wrap:wrap; font-size:10.5px; color:var(--muted); }
  .lb-sevbar .legend span { display:inline-flex; align-items:center; gap:3px; }
  .lb-sevbar .legend i { width:8px; height:8px; border-radius:2px; }
  .lb-detail { background:var(--code-bg); border:1px solid var(--code-border); border-radius:7px; margin:2px 12px 8px;
               padding:8px 10px; font-size:11px; }
  .lb-detail h5 { color:var(--blue); font-size:11px; margin:5px 0 2px; font-weight:700; }
  .lb-detail pre { white-space:pre-wrap; word-break:break-word; max-height:150px; overflow:auto;
                    color:#a5d6ff; font-size:11px; line-height:1.5; }
  .lb-log { margin-left:0; }
  .lb-head .tbtn + .tbtn { margin-left:0; }

  /* ---- 模块地图（执行卡内，结束后定格=漏洞地图）---- */
  .lc-map { display:flex; flex-wrap:wrap; gap:6px; padding:8px 12px; border-bottom:1px solid var(--code-border); }
  .mp { display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:3px 10px; border-radius:12px;
        border:1px solid var(--code-border); color:var(--muted); cursor:pointer; background:transparent; font-family:inherit; }
  .mp:hover { border-color:var(--accent); }
  .mp i { width:6px; height:6px; border-radius:50%; background:var(--map-dot); font-style:normal; flex-shrink:0; }
  .mp-run { border-color:rgba(126,231,135,.6); color:var(--text); }
  .mp-run i { background:var(--green); animation:pulse 1.2s infinite; }
  .mp-ok { border-color:rgba(126,231,135,.7); background:rgba(126,231,135,.1); color:var(--green); }
  .mp-ok i { background:var(--green); }
  .mp-none { background:var(--chip-bg); color:var(--muted); }
  .mp-none i { background:var(--map-dot); }
  .mp-fail { border-color:rgba(255,92,92,.7); background:rgba(255,92,92,.08); color:var(--red); }
  .mp-fail i { background:var(--red); }
  .mp-skip { opacity:.5; text-decoration:line-through; }
  .ph.exploit-cur-count { font-variant-numeric:tabular-nums; }

  /* ---- 左栏会话：任务状态副标题 + 底部进度条 ---- */
  .sess { position:relative; overflow:hidden; }
  .sess .m.taskrun { color:var(--green); }
  .sess .m.taskdone.ok { color:var(--green); }
  .sess .m.taskdone.bad { color:var(--red); }
  .sess .pbar { position:absolute; left:0; bottom:0; height:2px; background:var(--accent); min-width:2px; }

  /* ---- 会话内任务记录（报告/日志随时可取）---- */
  .artifact-row { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:12px; flex-wrap:wrap; }
  .artifact-sum { width:100%; font-size:11px; color:var(--muted); padding-left:2px; }
  .artifact-id { font-family:ui-monospace,monospace; color:var(--muted); }
  .artifact-stat { color:var(--muted); font-size:11px; flex:1; }

  /* ---- 新会话空态快捷启动 ---- */
  #empty { text-align:center; color:var(--muted); padding:60px 20px; font-size:14px; }
  .empty-title { margin-bottom:14px; }
  .chips { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .chip { background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:16px;
          padding:6px 14px; font-size:12.5px; cursor:pointer; }
  .chip:hover { border-color:var(--accent); color:var(--accent); }
  .chip small { color:var(--muted); margin-left:6px; }

  /* ---- findings 摘要（收尾消息）---- */
  .report-msg { align-self:flex-start; width:100%; max-width:920px; }
  .rep-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .sev { font-size:10.5px; font-weight:800; padding:1px 7px; border-radius:8px; text-transform:uppercase; flex-shrink:0; }
  .sev-critical{background:var(--danger-bg);color:var(--danger-text);} .sev-high{background:var(--danger-bg);color:var(--danger-text);}
  .sev-medium{background:#3d3520;color:var(--yellow);} .sev-low{background:#2b3a5f;color:var(--blue);}
  .sev-info{background:var(--pill-bg);color:var(--muted);}
  .f-class { font-family:ui-monospace,monospace; color:var(--blue-soft); font-size:11.5px; flex-shrink:0; min-width:74px; }
  .f-title { flex:1; min-width:0; }
  .f-status { font-size:10.5px; padding:1px 7px; border-radius:8px; font-weight:700; flex-shrink:0; }
  .rep-none { color:var(--muted); font-size:12.5px; }
  .report-msg details { margin-top:8px; }
  .report-msg summary { cursor:pointer; color:var(--accent); font-size:12px; }
  .rep-md { background:var(--code-bg); border:1px solid var(--code-border); border-radius:8px; padding:10px; margin-top:6px;
            font-size:12px; white-space:pre-wrap; word-break:break-word; max-height:320px; overflow:auto; }

  /* ---- 输入区 ---- */
  #inputbar { padding:12px 16px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:0; background:var(--panel); }
  .ib-row { display:flex; gap:10px; align-items:flex-end; }
  /* ---- 执行中动态状态栏（输入区上方通栏）---- */
  .run-status { display:none; align-items:center; gap:10px; padding:7px 12px; margin-bottom:8px;
                font-size:12px; color:var(--text); background:var(--panel2);
                border:1px solid var(--border); border-radius:9px; }
  .run-status.on { display:flex; }
  .run-dots { display:inline-flex; gap:3px; flex-shrink:0; }
  .run-dots i { width:6px; height:6px; border-radius:1px; background:var(--green);
                animation:runsquare 1s ease-in-out infinite; }
  .run-dots i:nth-child(1){ animation-delay:0s; } .run-dots i:nth-child(2){ animation-delay:.15s; }
  .run-dots i:nth-child(3){ animation-delay:.30s; } .run-dots i:nth-child(4){ animation-delay:.45s; }
  @keyframes runsquare {
    0%,100%{ transform:translateX(0); opacity:.25; }
    50%    { transform:translateX(5px); opacity:1; }
  }
  .run-text { white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .run-spacer { flex:1; }
  .run-stop { color:var(--danger-text); border-color:var(--danger-border); background:var(--danger-bg); }
  .run-stop:hover { filter:brightness(1.1); }
  /* ---- 任务参数抽屉（顶栏 ⚙ 参数 打开）---- */
  .param-overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:60; }
  .param-drawer { position:absolute; top:0; right:0; height:100%; width:370px; max-width:92vw;
                  background:var(--panel); border-left:1px solid var(--border);
                  box-shadow:-8px 0 24px rgba(0,0,0,.25); overflow-y:auto; padding-bottom:28px; }
  .param-head { display:flex; align-items:center; justify-content:space-between; padding:13px 16px;
                border-bottom:1px solid var(--border); font-weight:700; font-size:14px;
                position:sticky; top:0; background:var(--panel); z-index:1; }
  .param-note { padding:10px 16px; font-size:12px; color:var(--muted); line-height:1.55;
                border-bottom:1px solid var(--border); }
  .param-group { padding:13px 16px 2px; }
  .pg-title { font-size:11px; font-weight:700; color:var(--blue-soft); letter-spacing:.6px; margin-bottom:9px; }
  .param-group label { display:block; margin-bottom:13px; font-size:13px; color:var(--text); }
  .param-group label .hint { display:block; font-size:11px; color:var(--muted); margin:2px 0 5px; line-height:1.45; }
  .param-group input[type=number], .param-group select { width:100%; box-sizing:border-box; background:var(--bg);
                border:1px solid var(--border); border-radius:6px; color:var(--text); padding:6px 9px;
                font-size:13px; outline:none; }
  .param-group input[type=number]:focus, .param-group select:focus { border-color:var(--accent); }
  .param-group label.chk { display:flex; flex-direction:column; gap:3px; }
  .param-group label.chk input { width:auto; }
  .adv-grid .chk .hint { width:100%; }
  #taskInput { flex:1; background:var(--bg); border:1px solid var(--border); border-radius:10px;
               padding:12px 14px; font-size:14px; color:var(--text); resize:none; min-height:52px; max-height:200px;
               line-height:1.5; overflow-y:auto; outline:none; font-family:inherit; }
  #taskInput:focus { border-color:var(--accent); }
  .send { background:var(--accent); color:#fff; border:none; border-radius:10px; padding:12px 20px;
          font-size:14px; cursor:pointer; height:52px; }
  /* 运行中：按钮变"注入指令"（steer），与"发送新任务"视觉区分 */
  .send.steering { background:#a07818; }
  .send.steering:hover { filter:brightness(1.15); }
  /* 指令作用域下拉（仅 steer 模式显示，与"注入指令"按钮同色系） */
  #steerScope { height:52px; background:#8a6816; color:#fff; border:none; border-radius:10px;
                padding:0 10px; font-size:13px; cursor:pointer; max-width:150px; flex-shrink:0; }
  #steerScope:hover { filter:brightness(1.15); }
  .send:disabled { opacity:.5; cursor:not-allowed; }

  /* ---- 浮动控件 ---- */
  #followJump { position:absolute; right:24px; bottom:86px; background:var(--accent); color:#fff; border:none;
                border-radius:16px; padding:6px 14px; font-size:12px; cursor:pointer; display:none;
                box-shadow:0 3px 10px rgba(0,0,0,.4); z-index:5; }
  #toast { position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(20px);
           background:var(--pill-bg); border:1px solid var(--border); color:var(--text); border-radius:9px;
           padding:9px 18px; font-size:13px; opacity:0; pointer-events:none; transition:all .2s; z-index:99; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  ::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-thumb{background:var(--sb-thumb);border-radius:9px;}
  @media (max-width:760px){ aside{width:200px;} }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand"><span data-i18n="brand">渗透智能体</span><small>PI Meta · RedBee</small></div>
    <button data-i18n="newSess" class="tbtn on" id="newbtn" style="padding:10px;width:calc(100% - 24px);margin:10px 12px 6px">＋ 新建会话</button>
    <input data-i18n-ph="searchSess" id="sessSearch" placeholder="搜索会话…">
    <div id="sessToolbar">
      <label data-i18n="selectAll" class="selall" data-i18n-ti="checkBulkTitle" title="勾选后批量删除"><input type="checkbox" id="selectAll"> 全选</label>
      <button data-i18n="delSel" class="tbtn bulkd" id="bulkDelBtn" disabled>删除选中 (0)</button>
    </div>
    <button class="tbtn" id="taskViewBtn" style="margin:0 12px 6px;padding:7px;width:calc(100% - 24px)"
            title="跨会话查看所有任务：按状态/目标/文本过滤；点行打开对应会话并定位任务记录；↻ 一键重跑" data-i18n="taskOverview" data-i18n-ti="taskOverviewTip">📋 任务总览</button>
    <div id="sessionList"></div>
    <footer data-i18n="loadingModels" id="modelFooter">加载模型…</footer>
  </aside>

  <main>
    <div id="topbar">
      <label data-i18n="target">目标</label>
      <input id="targetInput" list="targetOptions" data-i18n-ph="targetPh" placeholder="http://<target-ip>  或留空（未知靶场先侦察）" autocomplete="off">
      <datalist id="targetOptions"></datalist>
      <label data-i18n="model">模型</label>
      <select id="modelSelect" data-i18n-ti="modelOverrideTip" title="全局模型覆盖：影响之后所有新任务；网关重启后重置"></select>
      <button class="tbtn" id="paramsBtn" data-i18n="paramsBtn" data-i18n-ti="paramsBtnTip" title="任务参数：本会话固定配置，后续任务沿用（点开设置）">⚙ 参数</button>
      <div id="authbar">
        <button class="tbtn" id="langBtn" title="切换语言 / Switch language">中/EN</button>
        <button class="tbtn" id="themeBtn" data-i18n-ti="themeTip" title="切换明暗主题（跟随系统/暗/亮）">🌙</button>
        <span id="userBadge"></span>
        <input id="tokenInput" type="password" placeholder="token" style="width:110px;display:none">
        <button data-i18n="login" class="tbtn" id="loginBtn" style="display:none">登录</button>
      </div>
    </div>

    <div id="content">
      <div id="chatView">
      <div id="msgs"><div id="empty" data-i18n="empty">新建会话或选择左侧历史会话，开始渗透任务</div></div>
      <button data-i18n="toBottom" id="followJump">↓ 回到底部</button>
      <div id="inputbar">
        <div id="runStatus" class="run-status">
          <span class="run-dots"><i></i><i></i><i></i><i></i></span>
          <span id="runStatusText" class="run-text" data-i18n="runStatusInitial">执行中…</span>
          <span class="run-spacer"></span>
          <button class="tbtn run-stop" id="stopBtn" data-i18n="stopBtn" data-i18n-ti="stopBtnTip" title="停止任务（取消子任务 + 杀沙箱容器）">■ 停止</button>
        </div>
        <div class="ib-row">
        <textarea id="taskInput" data-i18n-ph="taskPh" placeholder="描述渗透任务，如：打 DVWA 全模块，每模块一条干净 PoC 就下一个，别过度验证"></textarea>
        <select id="steerScope" data-i18n-ti="steerScopeTip" title="指令作用域：全部=广播给所有运行中模块；选具体模块=只注入该模块专员" style="display:none">
          <option value="" data-i18n="allModules">全部模块</option>
        </select>
        <button class="send" id="sendBtn" data-i18n="sendBtn">发送</button>
        </div>
      </div>
      </div>
      <!-- 全局任务总览视图（侧栏 📋 切换） -->
      <div id="taskView" style="display:none">
        <div class="tv-head">
          <span class="tv-title" data-i18n="taskOverview">任务总览</span>
          <select id="tvStatus" data-i18n-ti="statusFilterTip" title="按状态过滤">
            <option value="" data-i18n="statusAll">全部状态</option>
            <option value="running" data-i18n="statusRunning">运行中</option>
            <option value="done" data-i18n="statusDone">完成</option>
            <option value="cancelled" data-i18n="statusCancelled">已停止</option>
            <option value="runtime_error" data-i18n="statusError">失败</option>
            <option value="interrupted" data-i18n="statusInterrupted">中断</option>
          </select>
          <input id="tvTarget" data-i18n-ph="targetFilterPh" placeholder="按目标过滤…" style="width:170px">
          <input id="tvSearch" data-i18n-ph="searchFilterPh" placeholder="任务文本/ID 搜索…" style="width:170px">
          <span class="tv-count muted"></span>
        </div>
        <div class="tv-wrap">
          <table class="tv-table">
            <thead><tr>
              <th data-i18n="thTask">任务</th><th data-i18n="status">状态</th><th data-i18n="target">目标</th><th data-i18n="thFindings">发现</th><th data-i18n="thModules">模块</th><th data-i18n="thDur">耗时</th><th data-i18n="thTime">时间</th><th data-i18n="thActions">操作</th>
            </tr></thead>
            <tbody id="tvBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>
<!-- 任务参数抽屉：顶栏 ⚙ 参数 打开；本会话固定配置，后续任务沿用 -->
<div id="paramOverlay" class="param-overlay" style="display:none">
  <div class="param-drawer">
    <div class="param-head">
      <span data-i18n="paramDrawerTitle">任务参数</span>
      <button class="tbtn" id="paramClose" data-i18n-ti="closeTip" title="关闭">✕</button>
    </div>
    <div class="param-note" data-i18n="paramNote">本会话的固定配置，后续任务沿用。留空 = 跟随全局默认（已知靶场自动套快通配方）；填了 = 仅本任务覆盖。</div>
    <div class="param-group">
      <div class="pg-title" data-i18n="pgCoverage">覆盖范围</div>
      <label><span data-i18n="pModules">候选模块数</span>
        <span class="hint" data-i18n="pModulesHint">9 个 OWASP 漏洞模块里派几个（1-9）。小目标 2-3 个就够，省时间</span>
        <input id="pMaxModules" type="number" min="1" max="9" data-i18n-ph="phMod" placeholder="全局 9">
      </label>
      <label class="chk"><input id="pForceAll" type="checkbox">
        <span><span data-i18n="pForceAll">全派候选模块</span><br><span class="hint" data-i18n="pForceAllHint">不做智能剪枝，候选模块全部派发（已知靶场默认已开）</span></span>
      </label>
    </div>
    <div class="param-group">
      <div class="pg-title" data-i18n="pgDepth">深度与时长</div>
      <label><span data-i18n="pTurns">单模块最大轮次</span>
        <span class="hint" data-i18n="pTurnsHint">单个模块子 agent 的 LLM 对话轮数上限，防无限游走。快扫调低</span>
        <input id="pChildTurns" type="number" min="5" max="200" data-i18n-ph="phTurns" placeholder="全局 80">
      </label>
      <label><span data-i18n="pBudget">单模块时间预算（秒）</span>
        <span class="hint" data-i18n="pBudgetHint">单个模块子 agent 最长运行时间，到点自动收口（全局默认 1800）。CTF 长跑调大</span>
        <input id="pTaskBudget" type="number" min="300" max="21600" step="300" data-i18n-ph="phBudget" placeholder="全局 1800">
      </label>
    </div>
    <div class="param-group">
      <div class="pg-title" data-i18n="pgSpeed">速度与容错</div>
      <label><span data-i18n="pParallel">并行模块数</span>
        <span class="hint" data-i18n="pParallelHint">本任务同时打几个模块（1-8）。多任务并行时别太高，防 LLM 超时挂死</span>
        <input id="pMaxParallel" type="number" min="1" max="8" data-i18n-ph="phPar" placeholder="全局 2">
      </label>
      <label><span data-i18n="pRetry">死模块重试冷却（秒）</span>
        <span class="hint" data-i18n="pRetryHint">LLM 故障杀死模块后 N 秒自动整模块重试 1 次。0 = 不重试</span>
        <input id="pRetryDelay" type="number" min="0" max="600" step="30" data-i18n-ph="phRetry" placeholder="全局 60">
      </label>
    </div>
    <div class="param-group">
      <div class="pg-title" data-i18n="pgBehavior">行为</div>
      <label class="chk"><input id="pSkipRecon" type="checkbox">
        <span><span data-i18n="pSkipRecon">跳过侦察直接打</span><br><span class="hint" data-i18n="pSkipReconHint">有档案的靶场跳过重复侦察、热启动直接打（已知靶场默认已开）</span></span>
      </label>
    </div>
    <div class="param-group">
      <div class="pg-title" data-i18n="model">模型</div>
      <label><span data-i18n="pModelLbl">本任务模型</span>
        <span class="hint" data-i18n="pModelHint">指定模型排第一候选，挂了自动降级回队列其余。留空 = 全局自动</span>
        <select id="pModel"><option value="" data-i18n="autoModel">全局自动（跟随优先级队列）</option></select>
      </label>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";
/* ---- 明暗主题：跟随系统 / 暗色 / 亮色 三态切换，记忆到 localStorage ---- */
const THEME_MODES = ['auto','dark','light'];
const THEME_ICON  = {auto:'🌓', dark:'🌙', light:'☀️'};
let themeMode = localStorage.getItem('redbee_theme') || 'auto';
function applyTheme(){
  const dark = (themeMode === 'dark') ||
    (themeMode === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches === false);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  localStorage.setItem('redbee_theme', themeMode);
  const b = document.getElementById('themeBtn');
  if (b) b.textContent = THEME_ICON[themeMode];
}
function cycleTheme(){
  const i = THEME_MODES.indexOf(themeMode);
  themeMode = THEME_MODES[(i + 1) % THEME_MODES.length];
  applyTheme();
}
if (window.matchMedia){
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (themeMode === 'auto') applyTheme(); });
}
applyTheme();

/* ---- 国际化：中文(默认) / English ---- */
let lang = localStorage.getItem('redbee_lang') || 'zh';   // 'zh' 或 'en'
/* ---- 会话级参数（方案：每 session 持久一套，本会话后续新任务沿用）---- */
let sessParamsStore = {};   // { sid: {max_parallel, max_modules, ...} }
try { sessParamsStore = JSON.parse(localStorage.getItem('redbee_sess_params') || '{}') || {}; } catch(e) { sessParamsStore = {}; }
function persistSessParams(){ try { localStorage.setItem('redbee_sess_params', JSON.stringify(sessParamsStore)); } catch(e){} }
// 从输入框收集参数（发送时用）
function collectParamInputs(){
  const params = {};
  const _num = (sel, key) => { const v = $(sel).value.trim(); if (v) params[key] = parseInt(v, 10); };
  _num('#pMaxParallel', 'max_parallel');
  _num('#pMaxModules', 'max_modules');
  _num('#pChildTurns', 'child_max_turns');
  _num('#pTaskBudget', 'task_budget');
  _num('#pRetryDelay', 'module_retry_delay');
  if ($('#pSkipRecon').checked) params.skip_recon = true;
  if ($('#pForceAll').checked) params.force_all_modules = true;
  const _pm = $('#pModel').value; if (_pm) params.model = _pm;
  return params;
}
// 把参数填充回输入框（打开会话时恢复）。先清空再填，防上个会话的值残留串味。
function applyParamsToInputs(p){
  p = p || {};
  $('#pMaxParallel').value = p.max_parallel || '';
  $('#pMaxModules').value = p.max_modules || '';
  $('#pChildTurns').value = p.child_max_turns || '';
  $('#pTaskBudget').value = p.task_budget || '';
  $('#pRetryDelay').value = (p.module_retry_delay != null) ? p.module_retry_delay : '';
  $('#pSkipRecon').checked = !!p.skip_recon;
  $('#pForceAll').checked = !!p.force_all_modules;
  $('#pModel').value = p.model || '';
}
// 保存当前会话的参数（切走/发送后调用）
function saveCurSessParams(){
  if (!curSid) return;
  sessParamsStore[curSid] = collectParamInputs();
  persistSessParams();
}
// 加载指定会话的参数到输入框
function loadParamsToInputs(sid){
  applyParamsToInputs(sessParamsStore[sid] || {});
}
/* ---- 任务参数抽屉（顶栏 ⚙ 参数 打开；关闭时保存本会话参数）---- */
function openParamDrawer(){ $('#paramOverlay').style.display = 'block'; }
function closeParamDrawer(){
  saveCurSessParams();
  $('#paramOverlay').style.display = 'none';
}
const TRANS = {
  zh: {

function applyI18n(){
  // 静态元素：data-i18n = TRANS key
  document.querySelectorAll('[data-i18n]').forEach(el0=>{
    const k = el0.getAttribute('data-i18n');
    const entry = { zh: (TRANS.zh||{})[k], en: (TRANS.en||{})[k] };
    // 只翻译"叶子文本"节点(无子元素)，避免 textContent 清掉内嵌结构(如 <small>)
    if ((entry.zh || entry.en) && !el0.children.length) el0.textContent = _v(entry);
  });
  // 静态 placeholder
  document.querySelectorAll('[data-i18n-ph]').forEach(el0=>{
    const k = el0.getAttribute('data-i18n-ph');
    const entry = { zh: (TRANS.zh||{})[k], en: (TRANS.en||{})[k] };
    if (entry.zh || entry.en) el0.setAttribute('placeholder', _v(entry));
  });
  // 静态 title
  document.querySelectorAll('[data-i18n-ti]').forEach(el0=>{
    const k = el0.getAttribute('data-i18n-ti');
    const entry = { zh: (TRANS.zh||{})[k], en: (TRANS.en||{})[k] };
    if (entry.zh || entry.en) el0.setAttribute('title', _v(entry));
  });
  const lb = document.getElementById('langBtn');
  if (lb) lb.textContent = (lang === 'en') ? '中文' : 'EN';
}

/* ---------- API helper ---------- */
function _headers(json){
  const h = {};
  if (json) h['Content-Type']='application/json';
  if (sessionToken) h['Authorization']='Bearer '+sessionToken;
  return h;
}
async function api(path, {method='GET', json=null}={}){
  const res = await fetch(path, {method, headers:_headers(json!==null), body: json!==null?JSON.stringify(json):undefined});
  let data=null;
  try { data = await res.json(); } catch(e){}
  if (!res.ok) { const msg=(data&&data.error)||('HTTP '+res.status); throw new Error(msg); }
  return data;
}

let toastTimer=null;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), 3200);
}

function renderMsg(role, content, extra){
  // 旧会话的 [漏洞板] 逐条事件：弱化为一行灰字（新任务的板在执行卡的漏洞板区，不再落会话）
  if (typeof content==='string' && content.startsWith('[漏洞板]')){
    return el('div','boardline', content);
  }
  const wrap = el('div', 'msg ' + role);
  if (extra && extra.cls) wrap.classList.add(extra.cls);
  if (extra && extra.data) for (const k in extra.data) wrap.dataset[k] = extra.data[k];
  if (extra && extra.meta) wrap.appendChild(el('div', 'meta-line', extra.meta));
  if (role==='assistant' && extra && extra.status){
    const sp = el('span','status-pill st-'+extra.status, extra.status.toUpperCase());
    wrap.appendChild(sp);
  }
  const empty=$('#empty'); if (empty) empty.remove();
  if (typeof content === 'string' && /```/.test(content)){
    content.split(/```/).forEach((part,i)=>{
      if (i%2===0){ if(part.trim()) wrap.appendChild(document.createTextNode(part)); }
      else { const pre=el('pre'); pre.textContent=part.replace(/^\w+\n/,''); wrap.appendChild(pre); }
    });
  } else {
    wrap.appendChild(document.createTextNode(content));
  }
  return wrap;
}

function renderSessionList(list, taskBySess={}){
  const kw = $('#sessSearch').value.trim().toLowerCase();
  const box = $('#sessionList'); box.innerHTML='';
  list.forEach(s=>{
    if (kw && !(s.title||'').toLowerCase().includes(kw) && !s.id.includes(kw)) return;
    sessTitles[s.id] = s.title || s.id;
    const sel = selectedSids.has(s.id);
    const d = el('div','sess' + (s.id===curSid?' active':'') + (sel?' selected':''));
    d.dataset.sid = s.id;
    const ck = document.createElement('input');
    ck.type='checkbox'; ck.className='ck'; ck.checked=sel;
    if (runningTasks[s.id]){ ck.disabled=true; ck.title=tr('sessBusyTitle'); } else { ck.title=tr('checkBulkTitle'); }
    ck.onclick = e=>{ e.stopPropagation(); if(ck.checked) selectedSids.add(s.id); else selectedSids.delete(s.id);
      d.classList.toggle('selected', ck.checked); updateBulkBtn(); syncSelectAll(); };
    d.appendChild(ck);
    const info = el('div','si');
    const titleEl = el('div','t');
    if (runningTasks[s.id]) titleEl.appendChild(el('span','run-dot',''));
    titleEl.appendChild(document.createTextNode(s.title||s.id));
    info.appendChild(titleEl);
    // 副标题：有任务 = 任务状态+进度（运行中/完成/已停止/失败），无任务 = 创建时间
    const tinfo = taskBySess[s.id];
    let sub, subCls = 'm', pbarPct = null;
    if (tinfo){
      if (tinfo.status === 'running'){
        const tot = tinfo.modules_total||0, dn = tinfo.modules_done||0;
        sub = tr('sessSubRunning',{d:dn,t:tot,f:tinfo.findings||0});
        subCls = 'm taskrun';
        if (tot) pbarPct = Math.min(96, Math.round(dn/tot*100));
      } else {
        const smap = {done:tr('statusDone'), cancelled:tr('statusCancelled'), runtime_error:tr('statusError'), extraction_error:tr('statusError'), interrupted:tr('statusInterrupted')};
        sub = tr('sessSubDone',{st:smap[tinfo.status]||tinfo.status, f:tinfo.findings||0});
        subCls = 'm taskdone ' + ((tinfo.status==='done'||tinfo.status==='cancelled') ? 'ok' : 'bad');
      }
    } else {
      sub = new Date(s.created_at).toLocaleString();
    }
    info.appendChild(el('div', subCls, sub));
    d.appendChild(info);
    if (pbarPct!=null){ const pb = el('div','pbar'); pb.style.width = pbarPct+'%'; d.appendChild(pb); }
    const acts = el('div','acts');
    const rn = el('button','ibtn', '✎'); rn.title=tr('renameTip');
    rn.onclick = e=>{ e.stopPropagation(); startRename(d, s); };
    const del = el('button','ibtn del', '×');
    if (runningTasks[s.id]){ del.disabled=true; del.title=tr('sessBusyTitle'); } else { del.title=tr('delTip'); }
    del.onclick = e=>{
      e.stopPropagation();
      if (del.classList.contains('armed')){
        api(`/api/sessions/${s.id}`,{method:'DELETE'}).then(()=>{
          if (s.id===curSid){ curSid=null; $('#msgs').innerHTML=''; clearStream(); }
          selectedSids.delete(s.id);
          delete runningTasks[s.id];
          refreshSessions();
        }).catch(err=>toast(tr('delFail',{e:err.message})));
      } else {
        del.classList.add('armed'); del.textContent=tr('confirmQ');
        setTimeout(()=>{ del.classList.remove('armed'); del.textContent='×'; }, 2600);
      }
    };
    acts.append(rn, del);
    d.appendChild(acts);
    d.onclick = ()=> openSession(s.id);
    box.appendChild(d);
  });
  updateBulkBtn();
  syncSelectAll();
}

function startRename(sessEl, s){
  const titleEl = sessEl.querySelector('.t');
  const input = document.createElement('input');
  input.className='rename-input';
  input.value = s.title||'';
  titleEl.replaceWith(input);
  input.focus(); input.select();
  let done=false;
  const commit = async ()=>{
    if (done) return; done=true;
    const v=input.value.trim();
    if (v && v!==s.title){
      try { await api(`/api/sessions/${s.id}`,{method:'PATCH',json:{title:v}}); }
      catch(e){ toast(tr('renameFail',{e:e.message})); }
    }
    refreshSessions();
  };
  input.onblur = commit;
  input.onkeydown = e=>{
    e.stopPropagation();
    if (e.key==='Enter') commit();
    if (e.key==='Escape'){ done=true; refreshSessions(); }
  };
}

/* 重跑：原任务文本原样重派（目标不变）。task_text 缺失的旧任务 → 从会话派发消息解析兜底 */
async function rerunTask(t){
  if (t.status==='running'){ toast(tr('taskRunningToast')); return; }
  if (runningTasks[t.session_id]){ toast(tr('sessBusyToast')); return; }
  let text = String(t.task_text||'');
  if (!text && t.session_id){
    try { text = extractTaskText(await api(`/api/sessions/${t.session_id}/messages`), t.created_at); } catch(e){}
  }
  if (!text){ toast(tr('noOrigTextToast')); return; }
  await openTaskInSession(t);
  if (runningTasks[t.session_id]){ toast(tr('sessBusyToast')); return; }
  $('#taskInput').value = text;
  if (t.target) $('#targetInput').value = t.target;
  await sendTask();
}
/* 从会话消息里找与任务时间最近的派发消息（"任务: {text}  目标: {target}"），抽取任务文本 */
function extractTaskText(messages, taskCreatedAt){
  const t0 = Date.parse(taskCreatedAt);
  let best = null, bestD = Infinity;
  for (const m of messages||[]){
    if (m.role!=='user') continue;
    const c = String(m.content||'');
    if (!/^任务: [\s\S]+  目标: /.test(c)) continue;
    const d = Math.abs(Date.parse(m.created_at) - t0);
    if (d < bestD){ best = c; bestD = d; }
  }
  if (!best || bestD > 300000) return '';
  const m = best.match(/^任务: [\s\S]+  目标: /);
  return best.slice(0, m.index + m[0].length - '  目标: '.length).replace(/^任务: /,'');
}

  async function openSession(sid){
    showChatView();               // 从任务总览等视图切回聊天视图
    saveCurSessParams();          // 切走前，保存当前会话的参数
    curSid = sid;
    loadParamsToInputs(sid);      // 加载目标会话的参数
    const msgs=$('#msgs'); msgs.innerHTML='';
    let runningMsgEl = null;   // running 任务对应的用户消息元素（执行卡内联挂它下面）
    try {
      const ms = await api(`/api/sessions/${sid}/messages`);
      // 兼容旧数据：老版本完成时落库的"纯文本结论"（任务 tXXX 编排完成/已停止/执行失败:
      // …• [sev] class — title）已被任务记录块覆盖（带 ⬇报告/⬇日志），不再重复显示
      const visible = ms.filter(m => !(m.role === 'assistant'
        && /^任务 t[0-9a-f]+ (编排完成|已停止|执行失败)/.test(String(m.content || ''))));
      if (!visible.length) msgs.appendChild(emptyState());
      // 每条任务消息下内联挂该任务的任务记录（一一对应：同会话 created_at 最近匹配，
      // 会话内任务串行 → 消息与任务时间序天然交替，贪心最近匹配不会错配）
      const allTasks = (await api('/api/tasks')).filter(t=>t.session_id===sid);
      const pool = allTasks.slice().sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));
      const matchedIds = new Set();
      for (const m of visible){
        msgs.appendChild(renderMsg(m.role, m.content));
        // 派发消息固定格式 "任务: {task}  目标: {target}"（steer 消息不带该结构，不会误配）
        // 任务文本可能多行 → 用 [\s\S] 跨换行
        if (m.role!=='user' || !/^任务: [\s\S]+  目标: /.test(String(m.content||''))) continue;
        const t0 = Date.parse(m.created_at);
        let best=null, bestD=Infinity;
        for (const t of pool){
          if (matchedIds.has(t.task_id)) continue;
          const d = Date.parse(t.created_at) - t0;
          if (d >= -60000 && d < bestD){ best=t; bestD=d; }
        }
        if (!best) continue;
        matchedIds.add(best.task_id);
        if (best.status==='running'){ runningMsgEl = msgs.lastChild; continue; }
        let findings=null;
        try { const b = await api(`/api/task/${best.task_id}/board`); findings=(b&&b.findings)||[]; } catch(e){}
        const box = el('div','msg assistant report-msg');
        box.appendChild(recordRow(best, findings));
        msgs.appendChild(box);
      }
      // 兜底：未匹配到消息的已结束任务（消息被删等极端情况）→ 末尾统一块
      const unmatched = allTasks.filter(t=>t.status!=='running' && !matchedIds.has(t.task_id));
      if (unmatched.length){
        const boards = await Promise.all(unmatched.map(async t=>{
          try { const b = await api(`/api/task/${t.task_id}/board`); return (b&&b.findings)||[]; } catch(e){ return null; }
        }));
        const box = el('div','msg assistant report-msg');
        const h = el('div','rep-head');
        h.appendChild(el('span','status-pill st-done', tr('taskRecords',{n:unmatched.length})));
        box.appendChild(h);
        unmatched.forEach((t,i)=>box.appendChild(recordRow(t, boards[i])));
        msgs.appendChild(box);
      }
      scrollBottom(true);
    } catch(e){ msgs.appendChild(renderMsg('sys', tr('loadSessFail',{e:e.message}))); }
    const rt = runningTasks[sid];
    if (rt){
      if (rt !== curTaskId){
        // 该会话有进行中任务且当前流不属于它（含无活动流）：接流（执行卡内联到对应任务消息下）
        createLiveCard(rt, runningMsgEl);
        startStream(rt, sid);
      } else {
        // 已连接该会话的流：仅重建执行卡
        createLiveCard(rt, runningMsgEl);
      }
    } else if (curTaskId){
      // 该会话无进行中任务：断开流、隐藏状态栏
      //（后端任务继续跑，切回该 running 会话时上面分支自动重连）
      clearStream();
    }
   refreshSessions();
   // 从任务记录恢复目标，历史会话目标不可修改
   const task = taskBySess[sid];
   if (task && task.target) {
     $('#targetInput').value = task.target;
     $('#targetInput').disabled = true;
     $('#targetInput').placeholder = task.target;
   } else {
     $('#targetInput').value = '';
     $('#targetInput').disabled = false;
     $('#targetInput').placeholder = tr('targetPh');
   }
 }

/* 任务记录行：内联挂每条任务消息下（openSession）/ 末尾兜底块复用。
   报告/日志从会话内随时可取（刷新/重开不丢） */
function TASK_SMAP(){ return {done:tr('statusDone'), cancelled:tr('statusCancelled'), runtime_error:tr('statusError'), extraction_error:tr('statusError'), interrupted:tr('statusInterrupted')}; }
/* 任务记录行（+ 可展开的 findings 板 + 报告预览/下载/日志）
   返回 wrapper div：行 + 隐藏展开板，调用方直接 append 即可 */
function recordRow(t, findings){
  const row = el('div','artifact-row');
  row.dataset.task = t.task_id;   // 任务总览跳转定位用
  row.appendChild(el('span','artifact-id', t.task_id));
  row.appendChild(el('span','artifact-stat', tr('taskRecStat',{st:(TASK_SMAP()[t.status]||t.status), f:(t.findings||0)})));
  const sumParts = [fmtWhenRange(t.created_at, t.updated_at),
                    findings ? findingsSummary(findings) : ''].filter(Boolean);
  // 失败/中断任务附上原因摘要（如"目标不可达...""网关重启中断"）
  if ((t.status === 'runtime_error' || t.status === 'interrupted') && t.runtime_error_summary)
    sumParts.push(t.runtime_error_summary.length > 90 ? t.runtime_error_summary.slice(0,90)+'…' : t.runtime_error_summary);
  if (sumParts.length) row.appendChild(el('div','artifact-sum', sumParts.join(' · ')));
  const rb = reportBtn(t);
  const lb = el('button','tbtn',tr('logBtn'));
  lb.onclick = ()=> location.href = `/api/task/${t.task_id}/log/download`;
  const rr = el('button','tbtn',tr('rerunBtn'));
  rr.title=tr('rerunTip');
  rr.onclick = ()=> rerunTask(t);
  // 📋 查看发现：懒建展开板（复用 buildBoardList，行内可手动 误报/确认/恢复）
  if (findings && findings.length){
    const detail = el('div','record-detail');
    detail.style.display='none';
    const vb = el('button','tbtn',tr('findingsBtn'));
    vb.onclick = ()=>{
      if (!detail.dataset.built){
        detail.appendChild(buildBoardList(findings, {onStatus:(f,s)=>markFinding(t.task_id, f.id, s, detail)}));
        detail.dataset.built='1';
      }
      const show = detail.style.display==='none';
      detail.style.display = show?'block':'none';
      vb.classList.toggle('on', show);
    };
    row.append(vb, rb, lb, rr);
    const wrap = el('div','artifact-wrap');
    wrap.append(row, detail);
    return wrap;
  }
  row.append(rb, lb, rr);
  return row;
}

/* ---------- 执行过程卡片（按模块分组 + 漏洞板区）---------- */
const PHASES = ['pre-recon','recon','root-decide','exploit','report'];
let boardTimer = null;
function createLiveCard(taskId, afterEl){
  // 串行模型：每个任务一张独立执行卡，保留已定格的旧任务卡；仅当给同一 taskId 重复建卡时才移除旧卡
  // afterEl：内联挂在该元素后（openSession 恢复时挂到对应任务消息下）；缺省追加到底部
  if (liveState && liveState.taskId === taskId && liveState.card.parentNode) liveState.card.remove();
  const card = el('div','livecard');
  card.dataset.task = taskId;   // 任务总览跳转定位用
  const head = el('div','lc-head');
  const dot = el('span','lc-dot');
  const statusEl = el('span','lc-status st-running',tr('statusRunning'));
  head.append(dot, el('span','lc-title',tr('liveExec')),
               el('span','lc-agent',tr('redbeeAgent')), statusEl);
  const stepper = el('div','lc-stepper');
  PHASES.forEach((p,i)=>{
    if (i>0) stepper.appendChild(el('span','ph-sep','›'));
    stepper.appendChild(el('span','ph', p));
  });
  const meta = el('span','lc-meta','');
  const followBtn = el('button','tbtn lc-follow',tr('follow'));
  followBtn.onclick = ()=>{ setFollow(!follow); if (follow) scrollBottom(true); };
  head.append(stepper, meta, followBtn);
  // 模块地图（六色状态：wait/run/ok/none/fail/skip；结束后定格=漏洞地图）
  const mapEl = el('div','lc-map');
  const modsEl = el('div','lc-modules');
  // 漏洞板区（实时轮询 /board；结束后保留 = 最终成果板；点行展开 PoC/证据）
  const boardHead = el('div','lb-head');
  boardHead.appendChild(el('span','lb-title','🛡 '+tr('board')));
  const boardCount = el('span','lb-count','');
  boardHead.appendChild(boardCount);
  const boardRepBtn = el('button','tbtn lb-rep',tr('curReport'));
  boardRepBtn.title = tr('reportTip');
  boardRepBtn.style.display='none';
  boardRepBtn.onclick = async ()=>{
    boardRepBtn.disabled = true;
    try {
      const rep = await api(`/api/task/${taskId}/report`);
      if (rep && rep.report_md) openReportModal(taskId, tr('reportTitle',{id:taskId}), rep.report_md);
      else toast(tr('noReportData'));
    } catch(e){ toast(tr('getReportFail',{e:e.message})); }

  };
  boardHead.appendChild(boardRepBtn);
  const boardLogBtn = el('button','tbtn lb-log',tr('execLog'));
  boardLogBtn.title = tr('execLogTip');
  boardLogBtn.onclick = ()=>{ location.href = `/api/task/${taskId}/log/download`; };
  boardHead.appendChild(boardLogBtn);

                boardEl, boardCount, boardRepBtn, boardLogBtn,

                mpChips:{}, modFind:{}, finalized:false,

/* ---- 漏洞板轮询（5s；卡片移除/任务结束自动停；兼做完成检测——SSE 断了也能收口）---- */
const TERMINAL_STATUS = new Set(['done','cancelled','runtime_error','extraction_error','interrupted']);
function startBoardPoll(){
  if (boardTimer) clearInterval(boardTimer);
  const poll = async ()=>{
    const ls = liveState;
    if (!ls || !ls.card.isConnected){ stopBoardPoll(); return; }
    // 周期性状态提示：每 5s 刷新 meta（即使无新 SSE 事件）
    updLiveHeartbeat();
    try {
      const b = await api(`/api/task/${ls.taskId}/board`);
      if (liveState !== ls) return;
      renderBoard(ls, (b && b.findings) || []);
      if (b.status && TERMINAL_STATUS.has(b.status) && !ls.finalized && curTaskId === ls.taskId){
        ls.finalized = true;
        onTaskDone(b.status === 'done' ? 'done' : (b.status === 'cancelled' ? 'cancelled' : 'error'));
      }
    } catch(e){}
  };
  poll();
  boardTimer = setInterval(poll, 5000);
}
function stopBoardPoll(){
  if (boardTimer){ clearInterval(boardTimer); boardTimer = null; }
}
/* 手动改 finding 状态（后端 board.mark）。intoEl=记录展开板容器（改完原地重画）；
   缺省且命中当前 live 卡 → 重画 live 板（轮询也会兜底刷新） */
async function markFinding(taskId, fid, status, intoEl){
  try {
    const r = await api(`/api/task/${taskId}/findings/${fid}`, {method:'PATCH', json:{status}});
    if (!r || !r.ok) return false;
    const b = await api(`/api/task/${taskId}/board`);
    const nf = (b && b.findings) || [];
    if (intoEl){
      intoEl.replaceChildren(buildBoardList(nf, {onStatus:(f,s)=>markFinding(taskId, f.id, s, intoEl)}));
    } else if (liveState && liveState.taskId === taskId && liveState.boardEl){
      renderBoard(liveState, nf);
    }
    return true;
  } catch(e){ toast(tr('statusChangeFail',{e:e.message})); return false; }
}
/* 板内容（摘要+分布条+行列表）：纯函数，live 执行卡与历史任务记录展开共用。
   opts.onStatus(finding, newStatus) → 行内手动状态按钮回调 */
function buildBoardList(findings, opts){
  opts = opts || {};
  const list = el('div','lb-list');
  const sorted = [...findings].sort((a,b)=>
    ((SEV_RANK[a.severity]??9)-(SEV_RANK[b.severity]??9)) || (a.id-b.id));
  // 严重度分布条（纯 CSS）：有效发现按 severity 计数 + 堆叠条 + 图例
  const valid2 = findings.filter(f=>String(f.status||'found').toLowerCase()!=='false_positive');
  // 漏洞摘要（板顶 sticky）：总览行 + 每类漏洞一行（组内最高严重度着色，最多 2 个代表标题）
  if (valid2.length){
    const DG_SEV_COLOR = {critical:'#ff5c5c',high:'#f0883e',medium:'var(--yellow)',low:'#79c0ff',info:'var(--map-dot)'};
    const dg = el('div','lb-digest');
    dg.appendChild(el('div','dg-head',tr('vulnSummary')));
    const sevTot = {critical:0, high:0, medium:0, low:0, info:0};
    valid2.forEach(f=>{ const s=String(f.severity||'info').toLowerCase(); if (sevTot[s]!=null) sevTot[s]++; });
    const sevParts = ['critical','high','medium','low','info'].filter(k=>sevTot[k]).map(k=>k+' '+sevTot[k]);
    let tot = tr('validFindings',{n:valid2.length});
    if (sevParts.length) tot += '（'+sevParts.join(' / ')+'）';
    const confirmed = valid2.filter(f=>String(f.status||'').toLowerCase()==='confirmed').length;
    if (confirmed) tot += ' · confirmed '+confirmed;
    dg.appendChild(el('div','dg-total', tot));
    const groups = {};
    valid2.forEach(f=>{ const k=f.vuln_class||tr('unclassified'); (groups[k]=groups[k]||[]).push(f); });
    const glist = Object.entries(groups).sort((a,b)=>{
      const sa=Math.min(...a[1].map(f=>SEV_RANK[f.severity]??9)), sb=Math.min(...b[1].map(f=>SEV_RANK[f.severity]??9));
      return sa-sb || b[1].length-a[1].length;
    });
    const MAXG = 8;
    glist.slice(0,MAXG).forEach(([k,arr])=>{
      const top=[...arr].sort((a,b)=>(SEV_RANK[a.severity]??9)-(SEV_RANK[b.severity]??9))[0];
      const sevName=String(top.severity||'info').toLowerCase();
      const line=el('div','dg-line');
      line.appendChild(Object.assign(el('span','dg-dot'),{style:'background:'+(DG_SEV_COLOR[sevName]||'var(--map-dot)')}));
      line.appendChild(el('span','dg-cls', k+'（'+sevName+'×'+arr.length+'）'));
      const titles=[...new Set(arr.map(f=>f.title).filter(Boolean))].slice(0,2).join('；');
      line.appendChild(el('span','dg-titles', titles));
      dg.appendChild(line);
    });
    if (glist.length>MAXG) dg.appendChild(el('div','dg-more',tr('moreClasses',{n:(glist.length-MAXG)})));
    list.appendChild(dg);
  }
  if (valid2.length){
    const sev = {critical:0, high:0, medium:0, low:0, info:0};
    valid2.forEach(f=>{ const s=String(f.severity||'info').toLowerCase(); if (sev[s]!=null) sev[s]++; });
    const total = valid2.length;
    const bar = el('div','lb-sevbar');
    const segs = el('div','bar');
    ['critical','high','medium','low','info'].forEach(k=>{
      if (sev[k]) segs.appendChild(Object.assign(el('i','s-'+k),{style:'flex:'+sev[k]}));
    });
    bar.appendChild(segs);
    const leg = el('div','legend');
    ['critical','high','medium','low','info'].forEach(k=>{
      if (sev[k]){ const s=el('span','',  k+' '+sev[k]); s.prepend(Object.assign(el('i',''),{style:'background:'+({critical:'#ff5c5c',high:'#f0883e',medium:'var(--yellow)',low:'#79c0ff',info:'var(--map-dot)'})[k]||'var(--map-dot)'})); leg.appendChild(s); }
    });
    leg.appendChild(el('span','', tr('totalFindings',{n:total})));
    bar.appendChild(leg);
    list.appendChild(bar);
  }
  if (!sorted.length){ list.appendChild(el('div','lb-empty',tr('noFindings'))); }
  sorted.forEach(f=>{
    const st0 = String(f.status||'found').toLowerCase();
    const row = el('div','lb-row'+(st0==='false_positive'?' lb-fp':''));
    row.append(el('span','sev sev-'+(f.severity||'info'), f.severity||'info'));
    row.appendChild(el('span','f-title', f.title||tr('noTitle')));
    if (f.location) row.appendChild(el('span','lb-loc', f.location));
    row.appendChild(el('span','f-status st-'+st0, st0));
    // 手动状态流转（误报不再计入摘要；确认/恢复可回退）
    if (opts.onStatus && f.id!=null){
      const act = el('span','f-acts');
      const mk = (label, status)=>{
        const b2 = el('button','f-act', label);
        b2.title = tr('manualStatusTip');
        b2.onclick = ev=>{ ev.stopPropagation(); b2.disabled = true;
          opts.onStatus(f, status).then(ok=>{ if(!ok) b2.disabled = false; }); };
        return b2;
      };
      if (st0==='false_positive') act.appendChild(mk(tr('stRestore'),'found'));
      else act.appendChild(mk(tr('stFalsePositive'),'false_positive'));
      if (st0==='found') act.appendChild(mk(tr('stConfirm'),'confirmed'));
      else if (st0==='confirmed') act.appendChild(mk(tr('stRevert'),'found'));
      row.appendChild(act);
    }
    const det = el('div','lb-detail');
    det.style.display='none';
    if (f.poc){ det.appendChild(el('h5','PoC')); det.appendChild(Object.assign(el('pre'),{textContent:f.poc})); }
    if (f.evidence){ det.appendChild(el('h5',tr('evidenceLbl'))); det.appendChild(Object.assign(el('pre'),{textContent:f.evidence})); }
    if (!f.poc && !f.evidence) det.appendChild(el('span','lb-empty',tr('noPoc')));
    row.onclick = ()=>{ det.style.display = det.style.display==='none'?'block':'none'; };
    list.appendChild(row); list.appendChild(det);
  });
  return list;
}
function renderBoard(ls, findings){
  const valid = findings.filter(f=>String(f.status||'found').toLowerCase()!=='false_positive');
  ls.boardCount.textContent = valid.length ? tr('findingsShort',{n:valid.length}) : '';
  ls.boardRepBtn.style.display = findings.length ? '' : 'none';
  const list = buildBoardList(findings, {onStatus:(f,s)=>markFinding(ls.taskId, f.id, s)});
  ls.boardEl.replaceWith(list);
  ls.boardEl = list;
}

function updStepper(){
  const ls = liveState; if(!ls || !ls.stepper) return;
  let idx = PHASES.indexOf(ls.phase);
  if (ls.phase==='coverage-gap') idx = PHASES.indexOf('exploit');
  const done = Object.keys(ls.doneMods).length;
  const total = Object.keys(ls.mpChips).length;
  ls.stepper.querySelectorAll('.ph').forEach((st,i)=>{
    st.className = 'ph' + (idx>=0 && i<idx ? ' done' : (idx>=0 && i===idx ? ' cur' : ''));
    st.textContent = (st.textContent.split(' ')[0]);
    if (st.textContent==='exploit' && idx===PHASES.indexOf('exploit') && total)
      st.textContent = `exploit ${done}/${total}`;
  });
}

function ensureMod(name){
  const ls = liveState;
  if (ls.mods[name]) return ls.mods[name];
  const wrap = el('div','lc-mod');
  const h = el('div','lc-mod-head');
  const dot = el('span','mod-dot');
  const stateEl = el('span','mod-state',tr('statusRunning'));
  const callsEl = el('span','mod-calls',tr('callsCount',{n:0}));

}

// 周期性心跳状态提示：每 5s 由 startBoardPoll 的轮询调用。
// 即使 SSE 没有新事件(LLM 思考期间)，也让用户看到"任务还活着 + 距上次活动多久"，
// 不会误以为卡死。
function updLiveHeartbeat(){
  const ls = liveState; if (!ls) return;
  const now = Date.now();
  const seen = Object.keys(ls.seenMods).length;
  const done = Object.keys(ls.doneMods).length;
  const parts = [];
  if (seen) parts.push(tr('modulesProgress',{d:done,t:seen}));
  if (ls.calls) parts.push(tr('callsTotal',{n:ls.calls}));
  if (ls.phase) parts.push(ls.phase);
  const mins = ls.start ? Math.floor((now - ls.start)/60000) : 0;
  if (mins >= 1) parts.push(tr('elapsedMin',{n:mins}));
  else if (seen || ls.calls) parts.push(tr('statusRunning'));
  const idle = Math.max(0, Math.round((now - ls.lastActivity)/1000));
  if (idle < 90) parts.push(tr('lastActive',{n:idle}));
  else parts.push(tr('llmThinking',{n:Math.floor(idle/60)}));
  ls.meta.textContent = parts.join(' · ');
}

function onLive(d){
  const ls = liveState; if(!ls) return;
  // 任何 live(tool) 事件都刷新活动时间，供周期性心跳提示用
  ls.lastActivity = Date.now();
  for (const k of Object.keys(d.slots||{})){
    const s = d.slots[k];
    const sig = [s.tool||'', s.result==null?'':String(s.result).slice(0,400), s.last_message||'',
                 s.msg_count==null?'':s.msg_count, s.last_type||'', s.phase||''].join('\u0001');
    if (ls.lastSnap[k] === sig) continue;
    ls.lastSnap[k] = sig;
    if (s.phase) ls.phase = s.phase;
    const lt = s.last_type||'';
    const modName = s.module || 'main';
    if (s.module) ls.seenMods[s.module] = true;   // 任何带 module 的事件都计入（module_start 可能早于连接）
    if (lt==='module_start'){
      ensureMod(modName);
      mpSet(modName,'run');
    } else if (lt==='module_done'){
      const m = ensureMod(modName);
      m.dot.className='mod-dot done';
      m.stateEl.textContent = (s.last_message||tr('statusDone')).replace(/^\[[^\]]*\]\s*/,'');
      ls.doneMods[modName] = true;
      const nf = ls.modFind[modName]||0;
      mpSet(modName, nf?'ok':'none', nf?nf:'0');
    } else if (lt==='module_fail'){
      const m = ensureMod(modName);
      m.dot.className='mod-dot dead';
      m.stateEl.textContent = (s.last_message||tr('statusError')).replace(/^\[[^\]]*\]\s*/,'');
      ls.doneMods[modName] = true;
      mpSet(modName,'fail','✕', (s.last_message||tr('statusError')));
    } else if (lt==='result' && s.tool){
      if (s.tool==='submit_finding' && s.module && String(s.result||'').includes('"accepted": true'))
        ls.modFind[s.module] = (ls.modFind[s.module]||0)+1;
      addToolResult(s);
    } else if (s.tool){
      const m = ensureMod(modName);
      m.stateEl.textContent = tr('runningTool',{t:s.tool});
      if (ls.mpChips[modName] && !ls.doneMods[modName])
        mpSet(modName,'run', s.msg_count ? s.msg_count+'t' : '');
    } else if (s.last_message){
      scrollBottom();
    }
    updStepper();
    updCardMeta();
  }
}

function finalizeCard(status){
  const ls = liveState; if(!ls) return;
  const done = status==='done', cancelled = status==='cancelled';
  ls.statusEl.textContent = done?tr('statusDone'):(cancelled?tr('statusCancelled'):tr('statusError'));
  ls.statusEl.className = 'lc-status ' + (done?'st-done':(cancelled?'st-cancel':'st-error'));
  ls.dot.className = 'lc-dot ' + (done?'done':'dead');
  Object.values(ls.mods).forEach(m=>{
    if (!m.dot.classList.contains('done')) m.dot.className='mod-dot '+(done?'done':'dead');
    m.wrap.classList.add('collapsed');
  });
  // 模块地图定格：未启动 = 跳过；运行中被停止 = 无发现（灰色）
  Object.keys(ls.mpChips).forEach(n=>{
    const c = ls.mpChips[n];
    if (c.className.includes('mp-wait')) mpSet(n,'skip');
    else if (c.className.includes('mp-run')) mpSet(n,'none','0');
  });
  updCardMeta();
  scrollBottom(true);
}

/* 迷你 Markdown 渲染（无外部依赖，离线可用）。
   顺序：先整体 HTML 转义（报告来自 agent/LLM，防注入）→ 块级 → 行内 → 段落 */
function mdToHtml(md){
  let s = String(md||'').replace(/\r\n/g,'\n');
  s = s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/```(\w*)\n([\s\S]*?)```/g, (m,lang,code)=>'\n<pre><code>'+code+'\n</code></pre>\n');
  s = s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s = s.replace(/^### (.*)$/gm,'<h3>$1</h3>')
       .replace(/^## (.*)$/gm,'<h2>$1</h2>')
       .replace(/^# (.*)$/gm,'<h1>$1</h1>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  // GFM 表格：| h | h |\n|---|---|\n| c | c |
  s = s.replace(/(^|\n)(\|(?:[^|\n]*\|)+\n\|(?:\s*:?-+:?\s*\|)+\n(?:\|[^|\n]*\|\n?)+)/g, (m,pre,block)=>{
    const lines = block.trim().split('\n');
    const cells = l => l.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
    let h = pre+'<table><tr>'+cells(lines[0]).map(c=>'<th>'+c+'</th>').join('')+'</tr>';
    for (let i=2;i<lines.length;i++) h += '<tr>'+cells(lines[i]).map(c=>'<td>'+c+'</td>').join('')+'</tr>';
    return h+'</table>';
  });
  s = s.replace(/^&gt; ?(.*)$/gm,'<blockquote>$1</blockquote>');
  s = s.replace(/(^|\n)((?:- .*(?:\n|$))+)/g,(m,pre,block)=>
    pre+'<ul>'+block.trim().split('\n').map(l=>'<li>'+l.replace(/^- /,'')+'</li>').join('')+'</ul>');
  s = s.replace(/(^|\n)((?:\d+\. .*(?:\n|$))+)/g,(m,pre,block)=>
    pre+'<ol>'+block.trim().split('\n').map(l=>'<li>'+l.replace(/^\d+\. /,'')+'</li>').join('')+'</ol>');
  // 段落：连续非空、非块级标签的行合并成 <p>（行间 <br>）
  let out = '', para = [];
  const flush = ()=>{ if (para.length){ out += '<p>'+para.join('<br>')+'</p>'; para = []; } };
  for (const ln of s.split('\n')){
    if (/^\s*<\/?(h\d|pre|ul|ol|table|blockquote|\/tr|tr|\/th|th|\/td|td)/.test(ln)){ flush(); out += ln; }
    else if (!ln.trim()){ flush(); }
    else para.push(ln);
  }
  flush();
  return out;
}
